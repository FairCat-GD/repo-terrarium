[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.29.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FairCat-GD/repo-terrarium"
publish = false

[workspace.dependencies]
terrarium-truth = { path = "crates/terrarium-truth" }
terrarium-adapters = { path = "crates/terrarium-adapters" }
terrarium-store = { path = "crates/terrarium-store" }
terrarium-engine = { path = "crates/terrarium-engine" }
terrarium-compose = { path = "crates/terrarium-compose" }
terrarium-platform = { path = "crates/terrarium-platform" }

winit = "0.30.13"
softbuffer = { version = "0.4.8", default-features = false }
raw-window-handle = "0.6.2"
global-hotkey = "0.8.0"
# The egui windows: egui-winit and egui-wgpu on wgpu, never eframe. Only the backends each OS
# uses, and no clipboard, links or Linux window systems. `pollster` runs egui-wgpu's two async
# calls, which finish on their first poll.
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.36.2", default-features = false }
egui-wgpu = { version = "0.36.2", default-features = false, features = ["winit"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "metal", "dx12"] }
pollster = "1.0.1"
muda = { version = "0.20.0", default-features = false }
# The folder picker, one step of the two-step connect and locate flows. Only the macOS and
# Windows dialogs: no Linux portal or GTK.
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Truth: postcard for the cache, without the heapless it never uses; SHA-256 for golden hashes
# and RNG streams; proptest for its property tests.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.0", default-features = false }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
# The store: SQLite compiled in, so every install runs the same version. No statement cache, and
# no `fallible_uint`, so a `u64` cannot reach a column (stored integers are `i64`).
# `directories` finds the OS app-data directory; `tempfile` gives tests their own.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
rusqlite_migration = "2.6.0"
directories = "6.0.0"
tempfile = "3.27.0"
# Git, read in process and never through the git command line, pinned exactly because a bump can
# change truth. `sha1` is the only object format; `blob-diff` gives tree diffs with rename
# tracking; the dynamic pack cache speeds delta resolution. The defaults are off: they add
# worktree, network-free but large, features and an MPL cache crate.
gix = { version = "=0.88.0", default-features = false, features = [
    "sha1",
    "blob-diff",
    "pack-cache-lru-dynamic",
] }
# Source metrics, parsed in process (tree-sitter 0.26.x). The tier-one grammars, each through
# `tree-sitter-language`; the TypeScript crate holds TypeScript and TSX.
tree-sitter = "0.26.13"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
# The GitHub Actions weather (I-6), used only by `terrarium-adapters::ci`: rustls on ring, with
# Mozilla's root list compiled in (`webpki-roots`, the licence exception in deny.toml), so a
# poll reaches api.github.com and nothing else; the OS's certificate store could also ask a
# certificate's issuer about revocation. No gzip, json or cookies.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
# The probe's offline check of that client's TLS (`terrarium-adapters::ci::selfcheck`): the same
# rustls on ring and the same root list ureq links, with ureq's own features, so nothing new is
# built.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = { version = "1.0.9", default-features = false }
# The runs URL's branch and repository names.
percent-encoding = "2.3.2"
# The CI token, in the OS keychain (keyring 4.x, pinned exactly). Its `v1` mode picks the
# platform's store: the macOS keychain, the Windows credential manager.
keyring = "=4.2.0"
# The store keyring's `v1` mode makes, asked for an entry with modifiers: on Windows the token's
# credential is kept on this computer (`Local`), where `v1` alone would let it roam.
keyring-core = "=1.0.0"

# macOS FFI, used only by terrarium-platform. winit links objc2 0.5; these are 0.6, and the two
# never exchange types. The framework crates enable every framework by default.
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSAppleEventManager",
    "NSArray",
    "NSBundle",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSProcessInfo",
    "NSString",
    "NSValue",
] }
# The login item: `SMAppService`, macOS 13 and later.
objc2-service-management = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "SMAppService",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSColorSpace",
    "NSGraphics",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-quartz-core",
] }
# The strip's picture on macOS: a Core Animation layer showing the native image, which the
# window server scales nearest-pixel. The layer API and the features softbuffer already builds.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CALayer",
    "CATransaction",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "CGColor",
    "CGColorSpace",
    "CGDataProvider",
    "CGEventSource",
    "CGEventTypes",
    "CGImage",
    "CGWindowLevel",
] }
# macOS libc calls with no Foundation equivalent: the local time zone and the process's memory.
libc = "0.2.189"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFData",
    "CFString",
    "CFUUID",
] }

# Windows FFI, used only by terrarium-platform. Only the API families it calls.
windows = { version = "0.62.2", features = [
    "Wdk_System_SystemServices",
    "Win32_Devices_Display",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

cargo_metadata = "0.23.1"
# The report parsers: a streaming XML reader with no DTD processing, so a report cannot expand
# entities or fetch anything. No features: UTF-8 only, no serde.
quick-xml = { version = "0.42.0", default-features = false }
# xtask's asset pipeline reads the indexed art without expanding it.
png = "0.18.1"
# The time-lapse's GIF. No NeuQuant: compose quantizes, deterministically. `raii_no_panic` keeps
# an encoder dropped after a failed write from panicking in `Drop`.
gif = { version = "0.14.2", default-features = false, features = ["std", "raii_no_panic"] }
# The lexer behind xtask's scan of truth's sources; `span-locations` gives line numbers.
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
toml = "1.1.6"
# The engine's watcher: FSEvents on macOS, ReadDirectoryChangesW on Windows. Not the 9.0 release
# candidates.
notify = "8.2.0"
# A new terrarium's install salt, from the OS's random source (I-2).
getrandom = "0.4.3"

# Cargo cannot override workspace lints per crate (cargo#13157), so the per-crate differences
# (forbid vs allow of unsafe code, float_arithmetic in truth) are crate-level attributes.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# `verify`'s cost: the composer's property tests composite thousands of frames, and the arc's
# tests write its repository through gix and replay it, each in a process of its own.
# Unoptimized, they take minutes. Overflow checks and debug assertions stay on, as in every dev
# build, and none of this changes an output: truth is integer arithmetic, and Rust contracts no
# float operation at any level.
[profile.dev.package.terrarium-compose]
opt-level = 2

[profile.dev.package.terrarium-truth]
opt-level = 1

# Every dependency (not the workspace's crates): gix, its compression and hashing, SQLite.
[profile.dev.package."*"]
opt-level = 2

# Unwinding lets the engine worker catch a truth panic (I-16), and overflow checks stay on so a
# fixed-point overflow panics instead of wrapping silently. Built for size (N-08): the Windows
# exe was over its 25 MB. Only what runs every frame or replays history is built for speed: the
# composer, truth, the engine and the app.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
overflow-checks = true

[profile.release.package.terrarium-compose]
opt-level = 3

[profile.release.package.terrarium-truth]
opt-level = 3

[profile.release.package.terrarium-engine]
opt-level = 3

[profile.release.package.terrarium-app]
opt-level = 3
