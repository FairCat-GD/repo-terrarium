[package]
name = "terrarium-app"
description = "The repo-terrarium binary: window, presenter, egui windows and CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "repo-terrarium"
path = "src/main.rs"

[dependencies]
terrarium-truth.workspace = true
terrarium-adapters.workspace = true
terrarium-store.workspace = true
terrarium-engine.workspace = true
terrarium-compose.workspace = true
terrarium-platform.workspace = true
winit.workspace = true
softbuffer.workspace = true
global-hotkey.workspace = true
muda.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
pollster.workspace = true
rfd.workspace = true
notify.workspace = true

# `dev` builds add the debug window and the egui memory probe. Never a default feature: the
# debug window never ships in release builds (`cargo xtask verify`'s graph check).
[features]
default = []
dev = []

[dev-dependencies]
terrarium-adapters = { workspace = true, features = ["fixture"] }

[lints]
workspace = true
