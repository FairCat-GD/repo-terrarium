[package]
name = "terrarium-adapters"
description = "Readers for git history, reports and CI that turn a repository into observations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
terrarium-truth.workspace = true
gix.workspace = true
sha2.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

# `fixture` builds deterministic git repositories for tests, benches and xtask. It writes, so it
# never ships: only xtask and dev-dependencies may turn it on (`cargo xtask verify`'s graph
# check).
[features]
default = []
fixture = []

# The release-build budget for reading 10,000 commits, run by `cargo xtask bench`.
[[bench]]
name = "history"
harness = false
required-features = ["fixture"]

[lints]
workspace = true
