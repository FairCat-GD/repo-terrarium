# Truth must be a pure function of its inputs (I-1). Clippy reads only the nearest
# clippy.toml, so a root-level file added later would not apply here unless merged into this one.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order varies per run; use BTreeMap" },
    { path = "std::collections::HashSet", reason = "iteration order varies per run; use BTreeSet" },
    { path = "std::hash::DefaultHasher", reason = "its algorithm may change between Rust releases" },
    { path = "std::hash::RandomState", reason = "it is seeded per process" },
    { path = "f32", reason = "floats are not reproducible across platforms; use the fixed-point types" },
    { path = "f64", reason = "floats are not reproducible across platforms; use the fixed-point types" },
    { path = "std::time::Instant", reason = "truth reads no clock; time arrives as ticks" },
    { path = "std::time::SystemTime", reason = "truth reads no clock; time arrives as ticks" },
    { path = "std::time::Duration", reason = "truth measures time in ticks, and Duration yields floats" },
]
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "truth reads no wall clock; time arrives as ticks" },
    { path = "std::time::SystemTime::now", reason = "truth reads no wall clock; time arrives as ticks" },
    # Unstable sorts may order equal elements differently between Rust releases.
    { path = "slice::sort_unstable", reason = "equal elements may reorder between Rust releases; use sort" },
    { path = "slice::sort_unstable_by", reason = "equal elements may reorder between Rust releases; use sort_by" },
    { path = "slice::sort_unstable_by_key", reason = "equal elements may reorder between Rust releases; use sort_by_key" },
    { path = "slice::select_nth_unstable", reason = "equal elements may reorder between Rust releases" },
    { path = "slice::select_nth_unstable_by", reason = "equal elements may reorder between Rust releases" },
    { path = "slice::select_nth_unstable_by_key", reason = "equal elements may reorder between Rust releases" },
]
